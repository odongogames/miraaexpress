<!DOCTYPE html>
<html>
<head>
    <title>Jiwe Login Redirect</title>
</head>
<body>
    <h2>Authenticating... Returning you to Miraa Express Prototype.</h2>
    <script>
        // Grab the code and state from the URL (?code=xyz&state=abc)
        const urlParams = window.location.search;
        
        // Force-bounce the browser over to your custom scheme which Unity intercepts
        window.location.href = "com.supakoda.miraaexpress://oauth" + urlParams;
    </script>
</body>
</html>
